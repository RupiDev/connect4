<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #e63946, #f4d35e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 20px;
      min-height: 1.8rem;
      text-align: center;
    }

    .turn-indicator {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 6px;
      box-shadow: 0 0 8px currentColor;
    }

    #board-wrapper {
      position: relative;
    }

    #column-buttons {
      display: grid;
      grid-template-columns: repeat(7, 80px);
      gap: 6px;
      margin-bottom: 4px;
    }

    .col-btn {
      height: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.3);
      transition: color 0.15s, transform 0.15s;
      border-radius: 6px;
    }

    .col-btn:hover { color: rgba(255,255,255,0.9); transform: translateY(3px); }
    .col-btn:disabled { cursor: not-allowed; opacity: 0; }

    #board {
      display: grid;
      grid-template-columns: repeat(7, 80px);
      grid-template-rows: repeat(6, 80px);
      gap: 6px;
      background: #16213e;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    .cell {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0f3460;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .cell.red {
      background: #e63946;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 12px rgba(230,57,70,0.5);
    }

    .cell.yellow {
      background: #f4d35e;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 12px rgba(244,211,94,0.5);
    }

    .cell.win {
      animation: pulse 0.6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.12); }
    }

    #controls {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button.action {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    button.action:hover { opacity: 0.85; transform: translateY(-1px); }

    #restart-btn { background: #e63946; color: #fff; }

    .scores {
      display: flex;
      gap: 40px;
      margin-top: 20px;
      font-size: 1rem;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    .score-value {
      font-size: 2rem;
      font-weight: 700;
    }

    .score-box.red-score .score-value  { color: #e63946; text-shadow: 0 0 10px rgba(230,57,70,0.5); }
    .score-box.yellow-score .score-value { color: #f4d35e; text-shadow: 0 0 10px rgba(244,211,94,0.5); }

    .player-names {
      display: flex;
      gap: 40px;
      align-items: center;
      margin-bottom: 12px;
    }

    .player-name-input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      padding: 5px 10px;
      text-align: center;
      width: 120px;
      outline: none;
      transition: border-color 0.2s;
    }

    .player-name-input:focus { border-color: rgba(255,255,255,0.5); }
    .player-name-input.red-name  { border-color: rgba(230,57,70,0.5); }
    .player-name-input.yellow-name { border-color: rgba(244,211,94,0.5); }

    .vs { opacity: 0.4; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Connect 4</h1>

  <div class="player-names">
    <input class="player-name-input red-name" id="name1" type="text" value="Player 1" maxlength="12">
    <span class="vs">vs</span>
    <input class="player-name-input yellow-name" id="name2" type="text" value="Player 2" maxlength="12">
  </div>

  <div id="status"></div>

  <div id="board-wrapper">
    <div id="column-buttons"></div>
    <div id="board"></div>
  </div>

  <div class="scores">
    <div class="score-box red-score">
      <span class="score-label" id="score-label-1">Player 1</span>
      <span class="score-value" id="score1">0</span>
    </div>
    <div class="score-box yellow-score">
      <span class="score-label" id="score-label-2">Player 2</span>
      <span class="score-value" id="score2">0</span>
    </div>
  </div>

  <div id="controls">
    <button class="action" id="restart-btn">New Game</button>
  </div>

  <script>
    const ROWS = 6, COLS = 7;
    const COLORS = ['red', 'yellow'];

    let board, currentPlayer, gameOver, scores;

    function init() {
      board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      currentPlayer = 0;
      gameOver = false;
      scores = scores || [0, 0];
      renderBoard();
      renderColumnButtons();
      updateStatus();
    }

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell' + (board[r][c] ? ' ' + board[r][c] : '');
          cell.dataset.row = r;
          cell.dataset.col = c;
          boardEl.appendChild(cell);
        }
      }
    }

    function renderColumnButtons() {
      const container = document.getElementById('column-buttons');
      container.innerHTML = '';
      for (let c = 0; c < COLS; c++) {
        const btn = document.createElement('button');
        btn.className = 'col-btn';
        btn.textContent = '▼';
        btn.dataset.col = c;
        btn.addEventListener('click', () => dropPiece(c));
        container.appendChild(btn);
      }
    }

    function getPlayerName(idx) {
      return document.getElementById('name' + (idx + 1)).value.trim() || ('Player ' + (idx + 1));
    }

    function updateStatus(winCells) {
      const statusEl = document.getElementById('status');
      if (gameOver) return;
      const color = COLORS[currentPlayer];
      const dot = `<span class="turn-indicator" style="background:${color === 'red' ? '#e63946' : '#f4d35e'}"></span>`;
      statusEl.innerHTML = `${dot} ${getPlayerName(currentPlayer)}'s turn`;
    }

    function dropPiece(col) {
      if (gameOver) return;
      let row = -1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][col]) { row = r; break; }
      }
      if (row === -1) return;

      board[row][col] = COLORS[currentPlayer];

      const winCells = checkWin(row, col);
      if (winCells) {
        renderBoard();
        highlightWin(winCells);
        scores[currentPlayer]++;
        document.getElementById('score' + (currentPlayer + 1)).textContent = scores[currentPlayer];
        document.getElementById('score-label-' + (currentPlayer + 1)).textContent = getPlayerName(currentPlayer);
        const color = COLORS[currentPlayer];
        const dot = `<span class="turn-indicator" style="background:${color === 'red' ? '#e63946' : '#f4d35e'}"></span>`;
        document.getElementById('status').innerHTML = `${dot} ${getPlayerName(currentPlayer)} wins!`;
        gameOver = true;
        disableButtons();
        return;
      }

      if (board[0].every(cell => cell !== null)) {
        renderBoard();
        document.getElementById('status').textContent = "It's a draw!";
        gameOver = true;
        disableButtons();
        return;
      }

      currentPlayer = 1 - currentPlayer;
      renderBoard();
      updateStatus();
      updateScoreLabels();
    }

    function checkWin(row, col) {
      const color = board[row][col];
      const directions = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of directions) {
        const cells = [[row, col]];
        for (let i = 1; i < 4; i++) {
          const r = row + dr * i, c = col + dc * i;
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === color) cells.push([r,c]);
          else break;
        }
        for (let i = 1; i < 4; i++) {
          const r = row - dr * i, c = col - dc * i;
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === color) cells.push([r,c]);
          else break;
        }
        if (cells.length >= 4) return cells;
      }
      return null;
    }

    function highlightWin(cells) {
      cells.forEach(([r, c]) => {
        const idx = r * COLS + c;
        document.getElementById('board').children[idx].classList.add('win');
      });
    }

    function disableButtons() {
      document.querySelectorAll('.col-btn').forEach(b => b.disabled = true);
    }

    function updateScoreLabels() {
      document.getElementById('score-label-1').textContent = getPlayerName(0);
      document.getElementById('score-label-2').textContent = getPlayerName(1);
    }

    document.getElementById('restart-btn').addEventListener('click', () => {
      updateScoreLabels();
      init();
    });

    document.getElementById('name1').addEventListener('input', updateStatus);
    document.getElementById('name2').addEventListener('input', updateStatus);

    init();
  </script>
</body>
</html>
