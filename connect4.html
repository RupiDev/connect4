<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      padding: 20px;
      user-select: none;
    }

    h1 {
      font-size: 2.4rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #3a86ff, #06d6a0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── mode + difficulty toggles ── */
    .toggle-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .toggle-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
      margin-right: 4px;
    }

    .toggle-btn {
      padding: 6px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .toggle-btn:hover { border-color: rgba(255,255,255,0.5); color: #fff; }

    .toggle-btn.active {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.6);
      color: #fff;
      font-weight: 600;
    }

    #difficulty-row { display: none; }
    #difficulty-row.visible { display: flex; }

    /* ── player names ── */
    .player-names {
      display: flex;
      gap: 40px;
      align-items: center;
      margin-bottom: 12px;
    }

    .player-name-input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      padding: 5px 10px;
      text-align: center;
      width: 120px;
      outline: none;
      transition: border-color 0.2s;
      user-select: text;
    }

    .player-name-input:focus  { border-color: rgba(255,255,255,0.5); }
    .player-name-input.p1     { border-color: rgba(58,134,255,0.5); }
    .player-name-input.p2     { border-color: rgba(6,214,160,0.5); }
    .player-name-input:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .vs { opacity: 0.4; font-size: 0.85rem; }

    /* ── status + error ── */
    #status {
      font-size: 1.2rem;
      min-height: 1.8rem;
      text-align: center;
      margin-bottom: 4px;
    }

    #thinking-msg {
      font-size: 0.85rem;
      color: #06d6a0;
      min-height: 1.2rem;
      text-align: center;
      margin-bottom: 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #thinking-msg.visible { opacity: 1; }

    #error-msg {
      font-size: 0.9rem;
      color: #ff6b6b;
      min-height: 1.4rem;
      text-align: center;
      margin-bottom: 10px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #error-msg.visible { opacity: 1; }

    .turn-indicator {
      display: inline-block;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      vertical-align: middle;
      margin-right: 6px;
    }

    /* ── board ── */
    #board-wrapper {
      position: relative;
      cursor: pointer;
    }

    #board-wrapper.ai-turn { cursor: wait; }

    #preview-coin {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      top: -92px;
      pointer-events: none;
      opacity: 0;
      transition: left 0.1s ease, opacity 0.15s;
      z-index: 10;
    }

    #preview-coin.blue  { background: #3a86ff; box-shadow: 0 0 16px rgba(58,134,255,0.7); }
    #preview-coin.green { background: #06d6a0; box-shadow: 0 0 16px rgba(6,214,160,0.7); }
    #preview-coin.visible { opacity: 0.85; }

    #board {
      display: grid;
      grid-template-columns: repeat(7, 80px);
      grid-template-rows: repeat(6, 80px);
      gap: 6px;
      background: #16213e;
      padding: 12px;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      position: relative;
    }

    .cell {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0f3460;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.4);
      transition: background 0.15s;
      position: relative;
      overflow: hidden;
    }

    .cell.col-hover  { background: #163a6e; }

    .cell.ghost-blue  { background: rgba(58,134,255,0.25); }
    .cell.ghost-green { background: rgba(6,214,160,0.25); }

    .cell.red {
      background: #3a86ff;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 12px rgba(58,134,255,0.5);
    }
    .cell.yellow {
      background: #06d6a0;
      box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 12px rgba(6,214,160,0.5);
    }

    .cell.dropping {
      animation: drop var(--drop-dur, 0.35s) cubic-bezier(0.33, 0, 0.66, 1.4) forwards;
    }

    @keyframes drop {
      from { transform: translateY(var(--drop-from)); }
      to   { transform: translateY(0); }
    }

    .col-shake { animation: shake 0.4s ease; }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-6px); }
      40%     { transform: translateX(6px); }
      60%     { transform: translateX(-4px); }
      80%     { transform: translateX(4px); }
    }

    .cell.win {
      animation: pulse 0.6s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.12); }
    }

    /* ── scores ── */
    .scores {
      display: flex;
      gap: 40px;
      margin-top: 20px;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .score-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    .score-value { font-size: 2rem; font-weight: 700; }
    .score-box.p1-score .score-value { color: #3a86ff; text-shadow: 0 0 10px rgba(58,134,255,0.5); }
    .score-box.p2-score .score-value { color: #06d6a0; text-shadow: 0 0 10px rgba(6,214,160,0.5); }

    #controls { margin-top: 24px; }

    button.action {
      padding: 10px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      background: #3a86ff;
      color: #fff;
    }

    button.action:hover { opacity: 0.85; transform: translateY(-1px); }
  </style>
</head>
<body>
  <h1>Connect 4</h1>

  <!-- mode toggle -->
  <div class="toggle-row">
    <span class="toggle-label">Mode</span>
    <button class="toggle-btn active" id="mode-2p">2 Players</button>
    <button class="toggle-btn" id="mode-ai">vs AI</button>
  </div>

  <!-- difficulty (only shown in AI mode) -->
  <div class="toggle-row" id="difficulty-row">
    <span class="toggle-label">AI</span>
    <button class="toggle-btn active" data-diff="easy">Easy</button>
    <button class="toggle-btn" data-diff="medium">Medium</button>
    <button class="toggle-btn" data-diff="hard">Hard</button>
  </div>

  <div class="player-names">
    <input class="player-name-input p1" id="name1" type="text" value="Player 1" maxlength="12">
    <span class="vs">vs</span>
    <input class="player-name-input p2" id="name2" type="text" value="Player 2" maxlength="12">
  </div>

  <div id="status"></div>
  <div id="thinking-msg">AI is thinking…</div>
  <div id="error-msg"></div>

  <div id="board-wrapper">
    <div id="preview-coin"></div>
    <div id="board"></div>
  </div>

  <div class="scores">
    <div class="score-box p1-score">
      <span class="score-label" id="score-label-1">Player 1</span>
      <span class="score-value" id="score1">0</span>
    </div>
    <div class="score-box p2-score">
      <span class="score-label" id="score-label-2">Player 2</span>
      <span class="score-value" id="score2">0</span>
    </div>
  </div>

  <div id="controls">
    <button class="action" id="restart-btn">New Game</button>
  </div>

  <script>
    const ROWS = 6, COLS = 7;
    const CELL = 80, GAP = 6, PAD = 12;
    const STEP = CELL + GAP;
    // Search center columns first for better alpha-beta pruning
    const COL_ORDER = [3, 2, 4, 1, 5, 0, 6];
    const DEPTH_MAP  = { easy: 2, medium: 4, hard: 7 };

    let board, currentPlayer, gameOver, scores, animating, hoveredCol;
    let aiMode = false, difficulty = 'easy';

    // ── init ────────────────────────────────────────────────

    function init() {
      board         = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      currentPlayer = 0;
      gameOver      = false;
      animating     = false;
      hoveredCol    = -1;
      scores        = scores || [0, 0];
      renderBoard();
      updateStatus();
      hidePreview();
      clearError();
      setThinking(false);
      document.getElementById('board-wrapper').classList.remove('ai-turn');

      if (aiMode) {
        document.getElementById('name2').value = 'AI';
        document.getElementById('name2').disabled = true;
      } else {
        document.getElementById('name2').disabled = false;
        if (document.getElementById('name2').value === 'AI') {
          document.getElementById('name2').value = 'Player 2';
        }
      }
      updateScoreLabels();
    }

    // ── render ──────────────────────────────────────────────

    function renderBoard() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell' + (board[r][c] ? ' ' + board[r][c] : '');
          cell.dataset.row = r;
          cell.dataset.col = c;
          boardEl.appendChild(cell);
        }
      }
    }

    function cellEl(r, c) {
      return document.getElementById('board').children[r * COLS + c];
    }

    // ── hover preview ────────────────────────────────────────

    function getColFromEvent(e) {
      const rect = document.getElementById('board').getBoundingClientRect();
      const x    = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - PAD;
      const col  = Math.floor(x / STEP);
      return (col >= 0 && col < COLS) ? col : -1;
    }

    function getDropRow(col) {
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!board[r][col]) return r;
      }
      return -1;
    }

    function colorName(playerIdx) {
      return playerIdx === 0 ? 'blue' : 'green';
    }

    function cssClass(playerIdx) {
      return playerIdx === 0 ? 'red' : 'yellow';
    }

    function updateHover(col) {
      if (gameOver || animating || (aiMode && currentPlayer === 1)) return;

      if (hoveredCol !== -1) {
        for (let r = 0; r < ROWS; r++) {
          cellEl(r, hoveredCol).classList.remove('col-hover', 'ghost-blue', 'ghost-green');
        }
      }

      hoveredCol = col;
      if (col === -1) { hidePreview(); return; }

      const cn    = colorName(currentPlayer);
      const dropRow = getDropRow(col);

      for (let r = 0; r < ROWS; r++) {
        if (!board[r][col]) cellEl(r, col).classList.add('col-hover');
      }
      if (dropRow !== -1) {
        cellEl(dropRow, col).classList.add(`ghost-${cn}`);
      }

      const coin = document.getElementById('preview-coin');
      coin.className = `${cn} visible`;
      coin.style.left = (PAD + col * STEP) + 'px';
    }

    function hidePreview() {
      document.getElementById('preview-coin').className = '';
      hoveredCol = -1;
    }

    // ── drop piece ───────────────────────────────────────────

    function dropPiece(col) {
      if (gameOver || animating || col === -1) return;
      if (aiMode && currentPlayer === 1) return; // block clicks on AI turn

      const row = getDropRow(col);
      if (row === -1) {
        showError(`Column ${col + 1} is full! Pick another.`);
        shakeColumn(col);
        return;
      }

      clearError();
      playDrop(row, col);
    }

    function playDrop(row, col) {
      animating = true;
      board[row][col] = cssClass(currentPlayer);
      updateHover(-1);
      renderBoard();

      const el = cellEl(row, col);
      el.style.setProperty('--drop-from', `-${(row + 1) * STEP}px`);
      el.style.setProperty('--drop-dur',  `${0.1 + row * 0.04}s`);
      el.classList.add('dropping');

      el.addEventListener('animationend', () => {
        el.classList.remove('dropping');
        animating = false;

        const winCells = checkWin(row, col);
        if (winCells) {
          highlightWin(winCells);
          scores[currentPlayer]++;
          document.getElementById('score' + (currentPlayer + 1)).textContent = scores[currentPlayer];
          const dot = dotHtml(currentPlayer);
          document.getElementById('status').innerHTML =
            `${dot} ${getPlayerName(currentPlayer)} wins! 🎉`;
          gameOver = true;
          document.getElementById('board-wrapper').classList.remove('ai-turn');
          return;
        }

        if (board[0].every(c => c !== null)) {
          document.getElementById('status').textContent = "It's a draw!";
          gameOver = true;
          return;
        }

        currentPlayer = 1 - currentPlayer;
        updateStatus();
        updateScoreLabels();
        updateHover(hoveredCol);

        if (aiMode && currentPlayer === 1) scheduleAIMove();
      }, { once: true });
    }

    function shakeColumn(col) {
      for (let r = 0; r < ROWS; r++) {
        const el = cellEl(r, col);
        el.classList.remove('col-shake');
        void el.offsetWidth;
        el.classList.add('col-shake');
        el.addEventListener('animationend', () => el.classList.remove('col-shake'), { once: true });
      }
    }

    // ── AI ───────────────────────────────────────────────────

    function scheduleAIMove() {
      document.getElementById('board-wrapper').classList.add('ai-turn');
      setThinking(true);
      setTimeout(() => {
        const depth = DEPTH_MAP[difficulty];
        const col   = getBestMove(depth);
        setThinking(false);
        document.getElementById('board-wrapper').classList.remove('ai-turn');
        const row = getDropRow(col);
        playDrop(row, col);
      }, 300);
    }

    function getBestMove(depth) {
      let bestScore = -Infinity;
      let bestCol   = COL_ORDER.find(c => getDropRowBoard(board, c) !== -1);

      for (const col of COL_ORDER) {
        const row = getDropRowBoard(board, col);
        if (row === -1) continue;
        board[row][col] = 'yellow';
        const score = minimax(board, depth - 1, -Infinity, Infinity, false, row, col);
        board[row][col] = null;
        if (score > bestScore) { bestScore = score; bestCol = col; }
      }
      return bestCol;
    }

    // Minimax with alpha-beta pruning. AI = 'yellow', Human = 'red'.
    function minimax(b, depth, alpha, beta, isMaximizing, lastRow, lastCol) {
      if (isWinningBoard(b, lastRow, lastCol)) {
        return b[lastRow][lastCol] === 'yellow'
          ? 100000 + depth   // AI wins — prefer sooner
          : -100000 - depth; // Human wins
      }

      const valid = validCols(b);
      if (valid.length === 0) return 0; // draw
      if (depth === 0) return scoreBoard(b);

      if (isMaximizing) {
        let best = -Infinity;
        for (const col of COL_ORDER) {
          if (!valid.includes(col)) continue;
          const row = getDropRowBoard(b, col);
          b[row][col] = 'yellow';
          best = Math.max(best, minimax(b, depth - 1, alpha, beta, false, row, col));
          b[row][col] = null;
          alpha = Math.max(alpha, best);
          if (alpha >= beta) break;
        }
        return best;
      } else {
        let best = Infinity;
        for (const col of COL_ORDER) {
          if (!valid.includes(col)) continue;
          const row = getDropRowBoard(b, col);
          b[row][col] = 'red';
          best = Math.min(best, minimax(b, depth - 1, alpha, beta, true, row, col));
          b[row][col] = null;
          beta = Math.min(beta, best);
          if (alpha >= beta) break;
        }
        return best;
      }
    }

    function validCols(b) {
      const out = [];
      for (let c = 0; c < COLS; c++) { if (!b[0][c]) out.push(c); }
      return out;
    }

    function getDropRowBoard(b, col) {
      for (let r = ROWS - 1; r >= 0; r--) { if (!b[r][col]) return r; }
      return -1;
    }

    function isWinningBoard(b, row, col) {
      const color = b[row][col];
      const dirs  = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of dirs) {
        let n = 1;
        for (let i = 1; i < 4; i++) {
          const r = row + dr * i, c = col + dc * i;
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && b[r][c] === color) n++;
          else break;
        }
        for (let i = 1; i < 4; i++) {
          const r = row - dr * i, c = col - dc * i;
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && b[r][c] === color) n++;
          else break;
        }
        if (n >= 4) return true;
      }
      return false;
    }

    function scoreBoard(b) {
      let score = 0;

      // Center column preference
      for (let r = 0; r < ROWS; r++) {
        if (b[r][3] === 'yellow') score += 3;
      }

      // Score all windows of 4
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 4; c++) {
          score += scoreWindow([b[r][c], b[r][c+1], b[r][c+2], b[r][c+3]]);
        }
      }
      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r <= ROWS - 4; r++) {
          score += scoreWindow([b[r][c], b[r+1][c], b[r+2][c], b[r+3][c]]);
        }
      }
      for (let r = 3; r < ROWS; r++) {
        for (let c = 0; c <= COLS - 4; c++) {
          score += scoreWindow([b[r][c], b[r-1][c+1], b[r-2][c+2], b[r-3][c+3]]);
        }
      }
      for (let r = 0; r <= ROWS - 4; r++) {
        for (let c = 0; c <= COLS - 4; c++) {
          score += scoreWindow([b[r][c], b[r+1][c+1], b[r+2][c+2], b[r+3][c+3]]);
        }
      }
      return score;
    }

    function scoreWindow(w) {
      const ai    = w.filter(c => c === 'yellow').length;
      const human = w.filter(c => c === 'red').length;
      const empty = w.filter(c => !c).length;
      if (ai > 0 && human > 0) return 0;
      if (ai === 3 && empty === 1) return 50;
      if (ai === 2 && empty === 2) return 10;
      if (human === 3 && empty === 1) return -80;
      if (human === 2 && empty === 2) return -10;
      return 0;
    }

    // ── win detection (game board) ───────────────────────────

    function checkWin(row, col) {
      const color = board[row][col];
      const dirs  = [[0,1],[1,0],[1,1],[1,-1]];
      for (const [dr, dc] of dirs) {
        const cells = [[row, col]];
        for (let i = 1; i < 4; i++) {
          const r = row + dr * i, c = col + dc * i;
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === color) cells.push([r,c]);
          else break;
        }
        for (let i = 1; i < 4; i++) {
          const r = row - dr * i, c = col - dc * i;
          if (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r][c] === color) cells.push([r,c]);
          else break;
        }
        if (cells.length >= 4) return cells;
      }
      return null;
    }

    function highlightWin(cells) {
      cells.forEach(([r, c]) => cellEl(r, c).classList.add('win'));
    }

    // ── helpers ──────────────────────────────────────────────

    function getPlayerName(idx) {
      return document.getElementById('name' + (idx + 1)).value.trim() || ('Player ' + (idx + 1));
    }

    function dotHtml(playerIdx) {
      const bg = playerIdx === 0 ? '#3a86ff' : '#06d6a0';
      return `<span class="turn-indicator" style="background:${bg}"></span>`;
    }

    function updateStatus() {
      if (gameOver) return;
      document.getElementById('status').innerHTML =
        `${dotHtml(currentPlayer)} ${getPlayerName(currentPlayer)}'s turn`;
    }

    function updateScoreLabels() {
      document.getElementById('score-label-1').textContent = getPlayerName(0);
      document.getElementById('score-label-2').textContent = getPlayerName(1);
    }

    function setThinking(on) {
      document.getElementById('thinking-msg').classList.toggle('visible', on);
    }

    let errorTimer;
    function showError(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg;
      el.classList.add('visible');
      clearTimeout(errorTimer);
      errorTimer = setTimeout(() => el.classList.remove('visible'), 2000);
    }

    function clearError() {
      document.getElementById('error-msg').classList.remove('visible');
      clearTimeout(errorTimer);
    }

    // ── event listeners ──────────────────────────────────────

    const boardWrapper = document.getElementById('board-wrapper');

    boardWrapper.addEventListener('mousemove',  e => updateHover(getColFromEvent(e)));
    boardWrapper.addEventListener('mouseleave', () => updateHover(-1));
    boardWrapper.addEventListener('click',      e => dropPiece(getColFromEvent(e)));

    boardWrapper.addEventListener('touchstart', e => {
      e.preventDefault();
      updateHover(getColFromEvent(e));
    }, { passive: false });

    boardWrapper.addEventListener('touchend', e => {
      e.preventDefault();
      const col = getColFromEvent({ clientX: e.changedTouches[0].clientX });
      updateHover(-1);
      dropPiece(col);
    }, { passive: false });

    // mode buttons
    document.getElementById('mode-2p').addEventListener('click', () => {
      aiMode = false;
      document.getElementById('mode-2p').classList.add('active');
      document.getElementById('mode-ai').classList.remove('active');
      document.getElementById('difficulty-row').classList.remove('visible');
      init();
    });

    document.getElementById('mode-ai').addEventListener('click', () => {
      aiMode = true;
      document.getElementById('mode-ai').classList.add('active');
      document.getElementById('mode-2p').classList.remove('active');
      document.getElementById('difficulty-row').classList.add('visible');
      init();
    });

    // difficulty buttons
    document.querySelectorAll('[data-diff]').forEach(btn => {
      btn.addEventListener('click', () => {
        difficulty = btn.dataset.diff;
